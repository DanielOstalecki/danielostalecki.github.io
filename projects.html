<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Daniel Ostalecki</title>

  <style>
    :root{
      --bg:#0b0f19;
      --panel:#020617;
      --text:#e5e7eb;
      --muted: rgba(229,231,235,.70);
      --accent:#38bdf8;
      --shadow: 0 16px 50px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

    /* Sidebar (same) */
    .sidebar{width:240px;background:linear-gradient(180deg, rgba(2,6,23,1), rgba(2,6,23,.92));padding:26px 18px;position:fixed;height:100vh;border-right:1px solid rgba(56,189,248,.14)}
    .sidebarTop{background:rgba(15,23,42,.45);border:1px solid rgba(56,189,248,.18);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .sidebarTop .nameMini{margin:0;line-height:1.2;font-size:1.15rem}
    .sidebarTop .nameMini a{color:var(--text);text-decoration:none}
    .sidebarTop .roleMini{margin-top:6px;line-height:1.2;font-size:.9rem;color:var(--muted)}
    .nav{margin-top:18px;display:flex;flex-direction:column;gap:10px}
    .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--text);text-decoration:none;background:rgba(15,23,42,.22);border:1px solid rgba(56,189,248,.10)}
    .nav a:hover{border-color:rgba(56,189,248,.35);background:rgba(15,23,42,.40)}
    .dot{width:10px;height:10px;border-radius:999px;background:rgba(229,231,235,.25)}
    .nav a.active{border-color:rgba(56,189,248,.65);background:rgba(56,189,248,.12)}
    .nav a.active .dot{background:rgba(56,189,248,.98);box-shadow:0 0 0 4px rgba(56,189,248,.18)}

    /* Content */
    .content{margin-left:280px;width:100%;padding:60px 30px 80px}
    .wrap{max-width:1200px;margin:0 auto}
    h1{margin:0 0 10px 0;font-size:2.2rem}
    p{margin:10px 0;line-height:1.65;color:rgba(229,231,235,.9)}
    h2{margin:26px 0 14px 0;color:var(--accent)}

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(360px,1fr));
      gap:26px;
      justify-content:center;
      align-items:stretch;
      margin-top:14px;
    }
    .card{
      background:var(--panel);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:transform .18s ease;
    }
    .card:hover{transform:translateY(-6px)}
   .card img{
  width:100%;
  height:280px;
  object-fit:cover;
  object-position:center 15%;
  display:block;
  background:var(--panel);
}
    .t{padding:16px 16px 18px}
    .t h3{margin:0;font-size:1.2rem}
    .meta{margin-top:7px;color:var(--muted);font-size:1rem}
    a{color:inherit;text-decoration:none}

    @media (max-width:1000px){
      .grid{grid-template-columns:1fr}
      .card img{height:260px}
    }
    @media (max-width:800px){
      .sidebar{position:relative;width:100%;height:auto}
      .content{margin-left:0;padding:34px 18px 60px}
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebarTop">
      <div class="nameMini"><a href="about.html">Daniel Ostalecki</a></div>
      <div class="roleMini">Game Designer</div>
    </div>

    <nav class="nav">
      <a href="index.html"><span class="dot"></span>Home</a>
      <a class="active" href="projects.html"><span class="dot"></span>Projects</a>
      <a href="about.html"><span class="dot"></span>About</a>
    </nav>
  </div>

  <div class="content">
    <div class="wrap">
      <h1>Projects</h1>
      <p>Selected work. Click a project to view details.</p>

      <div class="grid">
        <div class="card">
          <a href="projects/hungerless.html">
            <img src="assets/img/hungerless.jpg" alt="Hungerless">
            <div class="t">
              <h3>Hungerless</h3>
              <div class="meta">Bastet Paw</div>
            </div>
          </a>
        </div>

        <div class="card">
          <a href="projects/celestial.html">
            <img src="assets/img/celestial.jpg" alt="Celestial">
            <div class="t">
              <h3>Celestial</h3>
              <div class="meta">Alter Learning</div>
            </div>
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
