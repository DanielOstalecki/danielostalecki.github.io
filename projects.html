<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Daniel Ostalecki</title>

  <style>
    :root{
      --bg:#0b0f19;
      --panel:#020617;
      --text:#e5e7eb;
      --muted: rgba(229,231,235,.70);
      --accent:#38bdf8;
      --shadow: 0 16px 50px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

    /* Sidebar */
  .sidebarTop{
  padding:14px;
}

.sidebarTop .nameMini{
  margin:0 !important;
  padding:0;
  line-height:1.2;
}

.sidebarTop .roleMini{
  margin:6px 0 0 0 !important;  /* QUESTO è lo spazio fisso */
  padding:0;
  line-height:1.2;
}
    .nav a:hover{border-color:rgba(56,189,248,.35);background:rgba(15,23,42,.40)}
    .dot{width:10px;height:10px;border-radius:999px;background:rgba(229,231,235,.25)}
    .nav a.active{border-color:rgba(56,189,248,.65);background:rgba(56,189,248,.12)}
    .nav a.active .dot{background:rgba(56,189,248,.98);box-shadow:0 0 0 4px rgba(56,189,248,.18)}

    /* Content */
    .content{margin-left:280px;width:100%;padding:50px 30px 80px}
    .wrap{max-width:1200px;margin:0 auto}
    h1{margin:0 0 10px 0;font-size:2.2rem}
    p{margin:0 0 26px 0;color:rgba(229,231,235,.9);line-height:1.6}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:24px;
    }
    .card{
      background:var(--panel);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:transform .18s ease;
    }
    .card:hover{transform:translateY(-6px)}
    .card img{width:100%;height:220px;object-fit:cover;display:block;background:var(--panel)}
    .t{padding:16px}
    .t h3{margin:0;font-size:1.15rem}
    .t .meta{margin-top:7px;color:var(--muted)}
    .card a{display:block;color:inherit;text-decoration:none}

    @media (max-width: 800px){
      .sidebar{position:relative;width:100%;height:auto}
      .content{margin-left:0;padding:30px 18px 60px}
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebarTop">
      <p class="nameMini"><a href="about.html">Daniel Ostalecki</a></p>
      <p class="roleMini">Game Designer</p>
    </div>
    <nav class="nav">
      <a href="index.html"><span class="dot"></span>Home</a>
      <a class="active" href="projects.html"><span class="dot"></span>Projects</a>
      <a href="about.html"><span class="dot"></span>About</a>
    </nav>
  </div>

  <div class="content">
    <div class="wrap">
      <h1>Projects</h1>
      <p>Selected works in game design, systems, prototyping and balancing.</p>

      <div class="grid">
        <div class="card">
          <a href="projects/hungerless.html">
            <img src="assets/img/hungerless.jpg" alt="Hungerless">
            <div class="t">
              <h3>Hungerless</h3>
              <div class="meta">Bastet Paw</div>
            </div>
          </a>
        </div>

        <div class="card">
          <a href="projects/celestial.html">
            <img src="assets/img/celestial.jpg" alt="Celestial">
            <div class="t">
              <h3>Celestial</h3>
              <div class="meta">Alter Learning</div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
